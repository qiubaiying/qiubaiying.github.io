# Site settings
title: Needham Blog
SEOTitle: Needham Lee 的个人空间
header-img: img/home-bg.jpg
email: lfcneedham@gmail.com
description: "把一些日子、片刻和心情留在这里"
keyword: "Needham Lee, Needham Blog, 个人博客, 日记, 散文, 摄影, 照片, 生活记录"
url: "https://lfcneedham.github.io"         # your host, for absolute URL
baseurl: ""      # for example, '/blog' if your blog hosted on 'host/blog'
github_repo: "https://github.com/LFCNeedham/LFCNeedham.github.io" # you code repository
lang: zh-CN
timezone: Asia/Shanghai

# Sidebar settings
sidebar: true                           # whether or not using Sidebar.
sidebar-about-description: "偶尔写字，偶尔发疯，偶尔把生活里的碎片收起来"
sidebar-avatar: /img/gaoda.jpg      # use absolute URL, seeing it's used in both `/` and `/about/`



# SNS settings
RSS: false
weibo_username:     Lee-意外
zhihu_username:     Needham
github_username:    LFCNeedham
# facebook_username:  baiying.qiu.7
# jianshu_username:   e71990ada2fd
#twitter_username:   qiubaiying




# Build settings
# from 2016, 'pygments' is unsupported on GitHub Pages. Use 'rouge' for highlighting instead.
permalink: pretty
paginate: 10
paginate_path: "/page:num/"
exclude: ["less","node_modules","Gruntfile.js","package.json","README.md"]
anchorjs: true                          # if you want to customize anchor. check out line:181 of `post.html`



# Plugins
plugins: [jekyll-paginate]




# Markdown settings
# replace redcarpet to kramdown,
# although redcarpet can auto highlight code, the lack of header-id make the catalog impossible, so I switch to kramdown
# document: http://jekyllrb.com/docs/configuration/#kramdown
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM                            # use Github Flavored Markdown !important



# 评论系统
# Disqus（https://disqus.com/）
# disqus_username: qiubaiying

# Gitalk
gitalk:
  enable: false   # 评论功能暂时关闭，避免公开 OAuth secret


# 统计

# Analytics settings
# Baidu Analytics
# ba_track_id: b50bf2b12b5338a1845e33832976fd68 # 后面需要替换成自己的

# Google Analytics
# ga_track_id: 'G-XXXXXXXXXX'          # Set a GA4 measurement ID when needed.
# ga_domain: auto





# Featured Tags
featured-tags: true                     # 是否使用首页标签
featured-condition-size: 1              # 相同标签数量大于这个数，才会出现在首页



# Progressive Web Apps
chrome-tab-theme-color: "#f3f1eb"
service-worker: true



