<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="google-site-verification" content="xBT4GhYoi5qRD5tr338pgPM5OWHHIDR6mNg1a3euekI" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.description }}">
    <meta name="keywords"  content="{{ site.keyword }}">
    <meta name="theme-color" content="{{ site.chrome-tab-theme-color }}">
    
    <title>{% if page.title %}{{ page.title }} - {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>

    <link rel="manifest" href="{{ site.baseurl }}/pwa/manifest.json">

    <link rel="shortcut icon" href="{{ site.baseurl }}/img/favicon.ico">
    
    <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">

    <link rel="stylesheet" href="{{ "/css/bootstrap.min.css" | prepend: site.baseurl }}">

    <link rel="stylesheet" href="{{ "/css/hux-blog.min.css" | prepend: site.baseurl }}">
    {% if page.layout == "post" or page.title == "Tags" %}
    <link rel="stylesheet" href="{{ "/css/tag-tree.css" | prepend: site.baseurl }}">
    {% endif %}
    {% if page.layout == "post" and page.tags contains "中国诗" %}
    <link rel="stylesheet" href="{{ "/css/poem-tags.css" | prepend: site.baseurl }}">
    {% endif %}
    {% if page.layout == "post" %}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous">
    {% endif %}
    <link rel="stylesheet" href="{{ "/css/syntax.css" | prepend: site.baseurl }}">

    <link href="//cdnjs.cloudflare.com/ajax/libs/font-awesome/4.6.3/css/font-awesome.min.css" rel="stylesheet" type="text/css">

    <!-- Analytics loaded deferred in footer (requestIdleCallback) to avoid blocking -->
</head>
