<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="google-site-verification" content="xBT4GhYoi5qRD5tr338pgPM5OWHHIDR6mNg1a3euekI">

    {% assign meta_description = page.description | default: page.subtitle | default: site.description | strip_html | strip_newlines %}
    {% assign social_image = page.header-img | default: site.header-img %}
    <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.SEOTitle }}{% endif %}</title>
    <meta name="description" content="{{ meta_description | escape }}">
    <meta name="keywords" content="{{ site.keyword | escape }}">
    <meta name="author" content="Needham Lee">
    <meta name="theme-color" content="{{ site.chrome-tab-theme-color }}">
    <meta name="color-scheme" content="light dark">
    <meta name="robots" content="index, follow">

    <link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}">
    <link rel="manifest" href="{{ '/pwa/manifest.json' | relative_url }}">
    <link rel="icon" href="{{ '/img/favicon.ico' | relative_url }}" sizes="any">
    <link rel="apple-touch-icon" href="{{ '/img/apple-touch-icon.png' | relative_url }}">
    <link rel="preload" as="image" href="{{ social_image | relative_url }}">

    <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
    <meta property="og:locale" content="zh_CN">
    <meta property="og:site_name" content="{{ site.title | escape }}">
    <meta property="og:title" content="{{ page.title | default: site.SEOTitle | escape }}">
    <meta property="og:description" content="{{ meta_description | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ social_image | absolute_url }}">
    <meta name="twitter:card" content="summary_large_image">

    <script>
        (function () {
            var saved = null;
            try { saved = localStorage.getItem('needham-theme'); } catch (error) { /* Use system theme. */ }
            var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.dataset.theme = saved || (systemDark ? 'dark' : 'light');
        }());
    </script>

    <link rel="stylesheet" href="{{ '/css/syntax.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/css/custom.css' | relative_url }}">
</head>
