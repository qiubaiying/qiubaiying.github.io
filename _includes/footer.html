<footer class="site-footer">
    <div class="footer-shell">
        <div class="footer-statement">
            <span class="footer-dot" aria-hidden="true"></span>
            <p>把日子写下来，时间就有了回声。</p>
        </div>
        <div class="footer-meta">
            <p>© {{ site.time | date: '%Y' }} {{ site.title }}</p>
            <div class="footer-links" aria-label="站外链接">
                {% if site.github_username %}<a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener noreferrer">GitHub ↗</a>{% endif %}
                {% if site.zhihu_username %}<a href="https://www.zhihu.com/people/{{ site.zhihu_username }}" target="_blank" rel="noopener noreferrer">知乎 ↗</a>{% endif %}
                {% if site.weibo_username %}<a href="https://weibo.com/{{ site.weibo_username }}" target="_blank" rel="noopener noreferrer">微博 ↗</a>{% endif %}
            </div>
        </div>
    </div>
</footer>

<script src="{{ '/js/site.js' | relative_url }}" defer></script>

{% if site.ga_track_id %}
<script>
    window.ga = window.ga || function () { (ga.q = ga.q || []).push(arguments); };
    ga.l = +new Date();
    ga('create', '{{ site.ga_track_id }}', '{{ site.ga_domain }}');
    ga('send', 'pageview');
</script>
<script async src="https://www.google-analytics.com/analytics.js"></script>
{% endif %}
