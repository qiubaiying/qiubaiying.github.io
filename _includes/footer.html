<footer class="site-footer">
    <div class="wrap">
        <p class="footer-copy">Copyright © {{ site.title }}{% if jekyll.environment == 'article_studio_preview' %} · 本地预览{% endif %}</p>
    </div>
</footer>

{% unless jekyll.environment == 'article_studio_preview' %}
<script src="https://scond.me/analytics.js" defer></script>

{% if site.ba_track_id %}
<script>
    var _hmt = _hmt || [];
    (function () {
        var hm = document.createElement("script");
        hm.src = "//hm.baidu.com/hm.js?" + "{{ site.ba_track_id }}";
        var s = document.getElementsByTagName("script")[0];
        s.parentNode.insertBefore(hm, s);
    })();
</script>
{% endif %}

{% if site.service-worker %}
<script>
    if (navigator.serviceWorker) {
        navigator.serviceWorker.register('/sw.js').catch(function (error) {
            console.log('ServiceWorker registration failed: ', error);
        });
    }
</script>
{% endif %}
{% endunless %}
