---
layout: default
---
<header class="page-head{% if page.plain-head %} page-head--plain{% endif %}">
    <div class="wrap">
        <div class="page-head-row">
            <h1>{{ page.title | default: site.title }}</h1>
            {% if page.rss %}
            <a class="rss-btn" href="{{ '/feed.xml' | relative_url }}">RSS 订阅</a>
            {% endif %}
        </div>
        {% if page.description %}<p class="tagline">{{ page.description }}</p>{% endif %}
    </div>
</header>

<div class="wrap prose">
    {{ content }}
</div>
