---
layout: default
---

<header class="page-hero" style="--page-image: url('{{ page.header-img | default: site.header-img | relative_url }}')">
    <div class="page-hero-shell">
        <p class="eyebrow eyebrow-light"><span></span> {{ page.kicker | default: 'Needham journal' }}</p>
        <h1>{{ page.title }}</h1>
        {% if page.description %}<p class="page-description">{{ page.description }}</p>{% endif %}
    </div>
</header>

<main class="page-shell" id="main-content">
    <article class="page-content prose">
        {{ content }}
    </article>
</main>
