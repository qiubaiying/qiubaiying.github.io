---
layout: default
---

<main class="keynote-page" id="main-content">
    <header class="keynote-heading">
        <div>
            <p class="eyebrow"><span></span> Presentation</p>
            <h1>{{ page.title }}</h1>
        </div>
        <a class="text-link" href="{{ page.iframe }}" target="_blank" rel="noopener noreferrer">全屏打开 <span aria-hidden="true">↗</span></a>
    </header>
    <div class="keynote-frame">
        <iframe src="{{ page.iframe }}" title="{{ page.title }} 演示文稿" allowfullscreen loading="eager"></iframe>
    </div>
</main>
