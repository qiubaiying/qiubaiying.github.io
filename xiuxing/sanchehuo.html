/* HUD chrome shared by every sim. 1rem = 10px at the 1080x1350 reference
   size; runtime sets html font-size from the viewport so it scales. */

:root {
  --bg: #09090a;
  --fg: #ece6d6;
  --dim: rgba(236, 230, 214, 0.64);
  --mute: rgba(236, 230, 214, 0.38);
  --faint: rgba(236, 230, 214, 0.16);
  --line: rgba(236, 230, 214, 0.14);
  --panel: rgba(9, 9, 10, 0.9);
  --accent: #f2b632;
  --top: 13.4rem;
  --bot: 30.5rem;
}
:root[data-theme='light'] {
  --bg: #f3f2ee;
  --fg: #151515;
  --dim: rgba(21, 21, 21, 0.66);
  --mute: rgba(21, 21, 21, 0.42);
  --faint: rgba(21, 21, 21, 0.16);
  --line: rgba(21, 21, 21, 0.16);
  --panel: rgba(243, 242, 238, 0.93);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
#app {
  position: fixed; inset: 0; color: var(--fg);
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-variant-ligatures: none; -webkit-font-smoothing: antialiased;
}
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hud { position: absolute; inset: 0; pointer-events: none; }
.hud.hidden { display: none; }
.accent { color: var(--accent); }

/* header */
.hdr {
  position: absolute; left: 0; right: 0; top: 0; height: var(--top);
  padding: 2.4rem 2.8rem 0;
  background: linear-gradient(var(--bg) 0%, var(--bg) 78%, transparent 100%);
}
.row { display: flex; align-items: baseline; white-space: nowrap; }
.row1 { gap: 5.6rem; }
.title { display: flex; align-items: center; gap: 1.3rem; font-size: 3.6rem; font-weight: 600; letter-spacing: 0.04em; }
.title .bar { display: inline-block; width: 0.75rem; height: 3.6rem; background: var(--accent); }
.sub { font-size: 1.75rem; color: var(--dim); letter-spacing: 0.08em; }
.right { margin-left: auto; font-size: 1.6rem; color: var(--dim); letter-spacing: 0.1em; }
.row2 { margin-top: 2rem; font-size: 1.95rem; }
.row2 .stage { width: 21rem; letter-spacing: 0.05em; }
.row2 .cmd { color: var(--fg); }
.row2 .time { margin-left: auto; letter-spacing: 0.05em; }
.prog { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 1.2rem; height: 0.35rem; }
.prog i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* viewport overlays */
.ann { position: absolute; inset: 0; overflow: hidden; }
.ann div {
  position: absolute; transform: translate(1.4rem, -50%); white-space: nowrap;
  font-size: 1.7rem; letter-spacing: 0.04em; color: var(--fg);
  text-shadow: 0 0 0.6rem var(--bg), 0 0 1.2rem var(--bg);
}
.ann div.a { color: var(--accent); }
.ann div.box {
  padding: 0.8rem 1.1rem; border: 1px solid var(--line); background: var(--panel);
  text-shadow: none; line-height: 1.45; font-size: 1.55rem;
}
.ann div.box b { color: var(--accent); font-weight: 600; }
.wm {
  position: absolute; right: 3rem; bottom: calc(var(--bot) + 1.6rem);
  font-size: 2.3rem; letter-spacing: 0.06em; color: var(--fg); opacity: 0.3;
}

/* bottom panel */
.bot {
  position: absolute; left: 0; right: 0; bottom: 0; height: var(--bot);
  display: flex; border-top: 1px solid var(--line); background: var(--panel);
  padding: 2rem 2.8rem 1.6rem;
}
.term { flex: 1; min-width: 0; display: flex; flex-direction: column; padding-right: 2.6rem; }
.thead { display: flex; align-items: baseline; gap: 2.4rem; font-size: 1.75rem; white-space: nowrap; }
.thead .host { font-size: 2.1rem; }
.thead .path { color: var(--dim); }
.thead .status { margin-left: auto; font-size: 1.5rem; letter-spacing: 0.1em; display: flex; align-items: center; gap: 0.9rem; }
.thead .status i { width: 1rem; height: 1rem; border-radius: 50%; background: var(--accent); display: inline-block; }
.prompt { margin-top: 1.9rem; font-size: 2.2rem; white-space: nowrap; overflow: hidden; }
.logs { margin-top: 1.1rem; font-size: 1.85rem; line-height: 1.52; flex: 1; overflow: hidden; }
.logs div { white-space: nowrap; overflow: hidden; text-overflow: clip; }
.logs .ln { color: var(--mute); display: inline-block; width: 6.4rem; }
.logs .hl { color: var(--accent); }
.caret { display: inline-block; width: 0.95em; height: 1.05em; vertical-align: -0.15em; background: var(--accent); margin-left: 0.15em; }
.tfoot { font-size: 1.35rem; color: var(--mute); white-space: nowrap; letter-spacing: 0.04em; }
.side {
  width: 31%; border-left: 1px solid var(--line); padding-left: 2.2rem;
  display: flex; flex-direction: column;
}
.shead { font-size: 1.45rem; letter-spacing: 0.12em; }
.mini { width: 100%; flex: 1; min-height: 0; display: block; margin: 0.8rem 0; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 1.4rem; font-size: 1.35rem; color: var(--mute); }
.stats b { display: block; font-size: 2rem; color: var(--fg); font-weight: 600; letter-spacing: 0.02em; }
.sfoot { margin-top: 0.8rem; font-size: 1.3rem; color: var(--mute); letter-spacing: 0.05em; }
.baseline { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 0.9rem; height: 0.25rem; background: var(--line); }
.baseline i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* director layers */
.dir-glitch { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.dir-flash {
  position: absolute; inset: 0; pointer-events: none; opacity: 0; mix-blend-mode: screen;
  background: radial-gradient(ellipse 75% 55% at 50% 45%, var(--accent) 0%, transparent 70%), rgba(255,255,255,0.18);
}
.dir-story {
  position: absolute; left: 0; right: 0; top: 0; bottom: 0; pointer-events: none;
  display: flex; align-items: flex-end; justify-content: center; padding: 0 4.5rem 6rem; opacity: 0;
}
.cap { text-align: center; max-width: 96rem; position: relative; }
.cap::before {
  content: ''; position: absolute; inset: -6rem -10rem; z-index: -1;
  background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0) 100%);
}
:root[data-theme='light'] .cap::before { background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(243,242,238,0.8) 0%, rgba(243,242,238,0) 100%); }
.cap-main {
  font-family: 'Inter', 'Inter Variable', system-ui, sans-serif; font-weight: 800;
  font-size: 11.5rem; line-height: 0.98; letter-spacing: -0.035em; color: var(--fg);
  text-shadow: 0 0.4rem 2.4rem rgba(0,0,0,0.55);
}
.cap.num .cap-main { font-size: 15rem; font-variant-numeric: tabular-nums; letter-spacing: -0.045em; }
.cap-main .w { display: inline-block; transform-origin: 50% 70%; }
.cap-main .w.hl { background: var(--accent); color: #0a0a0a; padding: 0 0.14em; text-shadow: none; border-radius: 0.06em; }
.cap-sub {
  margin-top: 2rem; font-size: 2.7rem; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--fg); opacity: 0.85; min-height: 1.3em;
}
.cap-tag {
  display: inline-block; margin-bottom: 1.8rem; padding: 0.5rem 1.2rem; font-size: 2.2rem; letter-spacing: 0.12em;
  border: 1px solid var(--accent); color: var(--accent); background: rgba(0,0,0,0.5);
}

/* Light studio, one accent: ink on rice paper, cinnabar marks the working part. */
html { font-size: clamp(9px, 0.78vw, 13.5px) !important; }
:root, :root[data-theme='light'] {
  --bg: #ece7dc;
  --fg: #262824;
  --dim: #62655d;
  --mute: #8a8c83;
  --line: rgba(48, 50, 46, 0.2);
  --faint: rgba(48, 50, 46, 0.09);
  --panel: rgba(250, 248, 242, 0.9);
  --accent: #c4442c;
  --gold: #b0842c;
  --teal: #4c817a;
}
body { font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; }
.qi-ui { position: fixed; inset: 0; z-index: 10; pointer-events: none; color: var(--fg); }
.qi-ui b, .qi-ui strong { font-weight: 650; }
.qi-ui.hidden > *:not(.qi-hdr):not(.qi-cursor) { display: none !important; }

.qi-hdr {
  position: absolute; left: 0; right: 0; top: 0; height: 7.2rem;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 2.6rem; background: linear-gradient(var(--bg) 68%, rgba(236,231,220,0));
}
.qi-brand { display: flex; align-items: center; gap: 1.3rem; }
.qi-brand > i { width: 0.5rem; height: 3.6rem; background: var(--accent); display: block; }
.qi-brand h1 { margin: 0; font-size: 2.05rem; letter-spacing: 0.02em; line-height: 1.2; }
.qi-brand p { margin: 0.35rem 0 0; font-size: 1.05rem; letter-spacing: 0.09em; color: var(--dim); text-transform: uppercase; }
.qi-hdr-r { display: flex; align-items: center; gap: 1.6rem; }
.qi-tag {
  font-size: 1.05rem; letter-spacing: 0.08em; padding: 0.45rem 0.9rem;
  border: 1px solid var(--accent); color: var(--accent); background: rgba(196,68,44,0.05);
}
.qi-tag.manual { border-color: var(--dim); color: var(--dim); background: transparent; }
.qi-clock { font: 600 1.5rem 'JetBrains Mono', monospace; color: var(--dim); }

.qi-sec {
  display: flex; align-items: baseline; justify-content: space-between;
  font-size: 1.1rem; letter-spacing: 0.14em; color: var(--fg);
  padding-bottom: 0.7rem; border-bottom: 1px solid var(--line); margin-bottom: 1rem;
}
.qi-sec span { color: var(--mute); font: 400 0.95rem 'JetBrains Mono', monospace; letter-spacing: 0.06em; }

.qi-steps { position: absolute; left: 2.6rem; top: 9.2rem; width: 22.5rem; pointer-events: auto; }
.qi-step {
  display: flex; align-items: center; gap: 1.1rem; width: 100%; text-align: left;
  padding: 0.85rem 0.9rem; margin-bottom: 0.45rem; cursor: pointer;
  background: var(--panel); border: 1px solid var(--line); border-left: 0.3rem solid transparent;
  color: var(--fg); font-family: inherit; transition: background .25s, border-color .25s, transform .25s;
  backdrop-filter: blur(6px);
}
.qi-step:hover { transform: translateX(0.3rem); border-color: var(--accent); }
.qi-step > i {
  font: 600 1.5rem 'JetBrains Mono', monospace; color: var(--mute);
  width: 2.2rem; height: 2.2rem; display: grid; place-items: center; border: 1px solid var(--line); flex: none;
}
.qi-step span { display: flex; flex-direction: column; gap: 0.2rem; min-width: 0; }
.qi-step b { font-size: 1.25rem; white-space: nowrap; }
.qi-step em { font: 400 0.9rem 'JetBrains Mono', monospace; color: var(--mute); font-style: normal; letter-spacing: 0.02em; }
.qi-step.done > i { color: var(--gold); border-color: var(--gold); }
.qi-step.on { border-left-color: var(--accent); background: rgba(196,68,44,0.075); }
.qi-step.on > i { color: #fff; background: var(--accent); border-color: var(--accent); }
.qi-step.on em { color: var(--accent); }

.qi-panel {
  position: absolute; right: 2.6rem; top: 9.2rem; width: 26.5rem; pointer-events: auto;
  background: var(--panel); border: 1px solid var(--line); padding: 1.3rem 1.4rem 1.2rem;
  backdrop-filter: blur(8px); box-shadow: 0 1rem 3rem rgba(60,50,40,0.06);
  /* keep the legend off the footer on short viewports */
  max-height: calc(100vh - 22.8rem); overflow-y: auto;
  scrollbar-width: thin; scrollbar-color: var(--line) transparent;
}
.qi-site { margin-bottom: 1.1rem; }
.qi-site label { display: block; font: 400 0.95rem 'JetBrains Mono', monospace; color: var(--mute); letter-spacing: 0.06em; }
.qi-site strong { display: block; font-size: 2rem; margin: 0.3rem 0 0.25rem; letter-spacing: 0.01em; color: var(--accent); }
.qi-site em { font-style: normal; font-size: 1.1rem; color: var(--dim); }
.qi-site em.inhale { color: var(--teal); }
.qi-phase { padding: 0.9rem 0 1rem; border-top: 1px solid var(--faint); }
.qi-line, .qi-phase-lbl { display: flex; justify-content: space-between; align-items: baseline; font-size: 1.05rem; color: var(--dim); }
.qi-line b { font: 600 1.5rem 'JetBrains Mono', monospace; color: var(--fg); }
.qi-bar { position: relative; height: 0.55rem; background: var(--faint); margin: 0.55rem 0 0.4rem; overflow: hidden; }
.qi-bar > i { position: absolute; inset: 0 auto 0 0; background: var(--accent); opacity: 0.75; }
.qi-bar > u { position: absolute; top: -0.2rem; bottom: -0.2rem; width: 1px; background: var(--dim); }
.qi-phase-lbl { font-size: 0.95rem; color: var(--mute); }
.qi-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 0.9rem 1.3rem; padding: 0.9rem 0; border-top: 1px solid var(--faint); }
.qi-metrics > div { min-width: 0; }
.qi-metrics label { display: block; font-size: 1rem; color: var(--dim); }
.qi-metrics b { font: 600 1.85rem 'JetBrains Mono', monospace; display: block; line-height: 1.35; }
.qi-metrics b small { font-size: 0.95rem; color: var(--mute); margin-left: 0.2rem; }
.qi-metrics i { display: block; height: 0.3rem; background: var(--faint); }
.qi-metrics i u { display: block; height: 100%; background: var(--gold); text-decoration: none; transition: width .12s linear; }
.qi-metrics > div:first-child i u { background: var(--accent); }
.qi-chart { padding: 0.5rem 0 0.8rem; border-top: 1px solid var(--faint); }
.qi-chart svg { width: 100%; height: 4.4rem; display: block; overflow: visible; }
.qi-grid { stroke: var(--line); stroke-width: 0.6; fill: none; }
#qGraph { stroke: var(--accent); stroke-width: 1.6; fill: none; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
#qDot { fill: var(--accent); }
.qi-gates { padding-top: 0.4rem; }
.qi-chips { display: flex; gap: 0.45rem; flex-wrap: wrap; }
.qi-chip { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 1rem; padding: 0.35rem 0.55rem; border: 1px solid var(--line); color: var(--dim); }
.qi-chip i { width: 0.55rem; height: 0.55rem; transform: rotate(45deg); border: 1px solid var(--mute); }
.qi-chip.open { color: var(--accent); border-color: rgba(196,68,44,0.45); background: rgba(196,68,44,0.06); }
.qi-chip.open i { background: var(--accent); border-color: var(--accent); }
.qi-legend { margin-top: 1rem; padding-top: 0.1rem; }
.qi-legend p { display: flex; align-items: center; flex-wrap: wrap; gap: 0.4rem; margin: 0.55rem 0 0; font-size: 0.98rem; color: var(--dim); }
.qi-legend i { display: inline-block; width: 0.8rem; height: 0.8rem; margin-left: 0.5rem; }
.qi-legend i:first-child { margin-left: 0; }
.k-qi { background: var(--accent); border-radius: 50%; }
.k-du { background: #8a5a4a; }
.k-ren { background: var(--gold); }
.k-gate { border: 1px solid var(--accent); transform: rotate(45deg); }
.k-tian { border: 0.2rem solid var(--fg); border-radius: 50%; }
.k-big { background: var(--teal); border-radius: 50%; }
.k-yin { background: #3f6f68; }
.k-yang { background: #9b3a26; }
.k-zuyang { background: #8a6a22; }
.k-zuyin { background: #3b5f9e; }
.k-clock { border: 0.2rem solid #8a6a22; border-radius: 50%; }
.k-wood { background: #3f6f68; }
.k-fire { background: #c4442c; }
.k-earth { background: #b0842c; }
.k-metal { background: #9aa0a6; }
.k-water { background: #3b5f9e; }
.k-gua { border: 0.2rem solid #c4442c; border-radius: 50%; }
.k-symbol { border: 0.2rem solid #3f6f68; border-radius: 50%; }

.qi-labels { position: absolute; inset: 0; }
.qi-label {
  position: absolute; display: flex; align-items: center; gap: 0.45rem;
  transform: translate(0, -50%); white-space: nowrap; pointer-events: none;
  font-size: 1.05rem; color: var(--fg); padding: 0.2rem 0.5rem 0.2rem 1.3rem;
  background: rgba(250,248,242,0.82); border: 1px solid var(--line);
  transition: color .2s, border-color .2s;
}
.qi-label > i { position: absolute; left: -1.1rem; top: 50%; width: 1.1rem; height: 1px; background: var(--dim); }
.qi-label > i::before { content: ''; position: absolute; left: -0.25rem; top: -0.2rem; width: 0.4rem; height: 0.4rem; border-radius: 50%; background: var(--dim); }
.qi-label b { font-weight: 600; }
.qi-label span { color: var(--mute); font-size: 0.9rem; }
.qi-label.gate { border-style: dashed; }
.qi-label.hot { color: var(--accent); border-color: var(--accent); background: rgba(255,250,245,0.94); }
.qi-label.hot > i, .qi-label.hot > i::before { background: var(--accent); }
.qi-label.hot span { color: var(--accent); opacity: 0.75; }

.qi-cursor { position: absolute; transform: translate(-0.4rem, -0.4rem); display: flex; align-items: center; gap: 0.5rem; }
.qi-cursor > i { width: 1.1rem; height: 1.1rem; border: 1px solid var(--accent); border-radius: 50%; background: rgba(196,68,44,0.16); }
.qi-cursor > span { font-size: 0.95rem; color: var(--accent); background: rgba(250,248,242,0.9); padding: 0.15rem 0.4rem; }

.qi-ctl {
  position: absolute; left: 0; right: 0; bottom: 0; pointer-events: auto;
  background: linear-gradient(rgba(244,241,234,0), var(--bg) 30%);
  padding: 2.4rem 2.6rem 0;
}
.qi-ctl-main { display: flex; align-items: stretch; gap: 2.2rem; border-top: 1px solid var(--line); padding-top: 1rem; }
.qi-btns { display: flex; flex-wrap: wrap; gap: 0.45rem; width: 34rem; flex: none; align-content: flex-start; }
.qi-btns button {
  font: 500 1.1rem 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif; color: var(--fg);
  border: 1px solid var(--line); background: var(--panel); padding: 0.55rem 0.75rem; cursor: pointer;
  display: inline-flex; align-items: center; gap: 0.5rem; transition: all .2s;
}
.qi-btns button:hover { border-color: var(--accent); color: var(--accent); }
.qi-btns button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.qi-btns button.on kbd { color: #fff; border-color: rgba(255,255,255,0.5); }
.qi-btns kbd { font: 400 0.85rem 'JetBrains Mono', monospace; color: var(--mute); border: 1px solid var(--line); padding: 0 0.25rem; }
.qi-desc { flex: 1; min-width: 0; border-left: 1px solid var(--line); padding-left: 2rem; }
.qi-desc b { display: block; font-size: 1.3rem; margin-bottom: 0.3rem; }
.qi-desc span { display: block; font-size: 1.05rem; color: var(--dim); line-height: 1.55; }
.qi-desc em { display: block; font-style: normal; font-size: 1rem; color: var(--accent); margin-top: 0.35rem; }
.qi-foot {
  display: flex; justify-content: space-between; gap: 2rem; padding: 0.85rem 0 0.7rem;
  font-size: 0.95rem; color: var(--mute); border-top: 1px solid var(--faint); margin-top: 0.9rem;
}
.qi-foot span:last-child { text-align: right; }

@media (max-width: 1100px) {
  .qi-steps { width: 18rem; }
  .qi-panel { width: 22rem; }
  .qi-btns { width: 26rem; }
  .qi-desc { display: none; }
}

/* Deployed in a blog: a way back, and a readable fallback without WebGL. */
.qi-back {
  pointer-events: auto; font-size: 1.05rem; color: var(--dim); text-decoration: none;
  border-bottom: 1px solid var(--line); padding-bottom: 0.15rem; white-space: nowrap;
}
.qi-back:hover { color: var(--accent); border-color: var(--accent); }
.qi-back::before {
  content: ''; display: inline-block; width: 0.45rem; height: 0.45rem;
  border-left: 1px solid currentColor; border-bottom: 1px solid currentColor;
  transform: rotate(45deg); margin-right: 0.5rem; vertical-align: 0.12rem;
}
.qi-rotate { display: none; }
.qi-fallback {
  position: absolute; inset: 0; overflow: auto; padding: 3rem 6vw 5rem;
  background: var(--bg); color: var(--fg); font-family: inherit;
}
.qi-fallback h1 { font-size: 2.4rem; margin: 1.2rem 0 0.8rem; }
.qi-fallback p { font-size: 1.3rem; color: var(--dim); line-height: 1.7; max-width: 64rem; }
.qi-fallback img {
  display: block; width: 100%; max-width: 110rem; height: auto;
  margin: 1.4rem 0; border: 1px solid var(--line);
}
.qi-fallback .qi-back { display: inline-block; }
.qi-fallback .qi-fallback-note { font-size: 1.05rem; color: var(--mute); }

@media (max-width: 760px) and (orientation: portrait) {
  .qi-rotate {
    display: block; position: absolute; left: 50%; bottom: 11rem; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--line); padding: 0.5rem 0.9rem;
    font-size: 1.05rem; color: var(--dim); white-space: nowrap; pointer-events: none;
  }
  .qi-hdr-r .qi-tag { display: none; }
  .qi-panel { width: 19rem; }
  .qi-steps { width: 15rem; }
}
