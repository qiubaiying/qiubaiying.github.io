# 术语与异说：图谱按各自依据的体系标注，不混用定义。
- term: "三田"
  note: "真气运行法定义为上丹田百会、中丹田心窝部、下丹田小腹部；丹道通行说法为泥丸、绛宫、气海。两套定义不同，N1 依真法，N2 依丹道，页面内均已注明。"
- term: "三关"
  note: "尾闾关、夹脊关、玉枕关，督脉由下而上的三处关口。历代对具体位置有异说，亦有以其他督脉穴位当之者；本栏目取通行说，不主张唯一。"
- term: "小周天 / 大周天"
  note: "真法中多指任督一圈与经络周天；丹道中「小周天」对应子午周天（炼精化气），「大周天」对应卯酉周天（炼气化神）；经络体系里又指十二正经流注。三个体系的定义并不等同。"
- term: "河车三车"
  note: "牛车、羊车、鹿车，喻真气过三关时行进的缓、中、疾，是火候的比喻，不是器械或解剖结构。"
- term: "火候"
  note: "丹家以神为火、以运火退符的时刻与数度为候。图中以同一相位下的分段速度示意，不代表任何可测量的生理量；丹家火候依「活子时」之机而不依固定刻度，图中相位是建模变量，也不是火候本身。见「活子时」条。"
- term: "药物 / 鼎炉"
  note: "药物指精、气、神；鼎炉喻三丹田所在，皆就内丹「以身为鼎炉」而言。此为丹经隐语，用于说明关系，不作实体或疗效宣称；与外丹的炉鼎烧炼、矿物服食不是一回事，见「外丹 / 内丹」条。"
- term: "精气神 / 性命"
  note: "内丹理论的核心要素与修持两面。本栏目只处理这些概念在文献中的结构关系，不涉及修炼验证；性功与命功之分见「性功 / 命功」条。"
- term: "十二正经"
  note: "手三阴、手三阳、足三阳、足三阴共十二条，气血按肺→大肠→胃→脾→心→小肠→膀胱→肾→心包→三焦→胆→肝如环无端地流注。图中只示右侧，左右对称；循行线为教学示意。"
- term: "奇经八脉"
  note: "任、督、冲、带、阴跷、阳跷、阴维、阳维。不直属脏腑、无表里配对，作用是蓄溢调节十二经气血：任为阴脉之海，督为阳脉之海，冲为十二经之海，带脉约束纵行诸经。"
- term: "子午流注"
  note: "「岁有十二月，日有十二辰，子午为经，卯酉为纬」，以十二时辰描述气血在各经的盛衰开合。属传统时间模型，不是诊疗或养生时刻建议。"
- term: "营卫 / 五十营"
  note: "「营在脉中，卫在脉外」：营气沿十二经流注，卫气布散体表；一说一昼夜各循行五十周。图中以脉内当令经与脉外体表环两层同显，只作概念示意。"
- term: "大周天（异说）"
  note: "真法与部分气功文献指经络周天（十二正经 / 奇经八脉）；丹道「大周天」指中关炼气化神的卯酉周天，与「小周天」子午周天相对；经络体系里又指十二经流注。三种定义不等同，B3 取经络体系义，N3 亦取经络义且不再挂「中关」阶位。"

# —— 补：已刊图谱所依据的入门与回路概念 ——
- term: "三调"
  note: "调身、调息、调心，入手时正体放松、由粗息入细息、凝神入静的次第。N0 依此建模，任督只作淡背景。三调是传统入门科目的概括，各家先后与侧重不一；图只示次序，不示效验，也不作练法指导。"
- term: "真气运行法五步功"
  note: "李少波真气运行法公开的五步练习次第，属 20 世纪中期成型的现代气功体系。N1 依其所述三田三关建立任督闭合回路：上丹田百会、中丹田心窝部、下丹田小腹部，三关为尾闾、夹脊、玉枕。与丹道通行的泥丸、绛宫、气海不是同一套定位，见「三田」条；本栏目只取其结构，不作练法转述。"
- term: "任督二脉"
  note: "任脉行身前正中、督脉行身后正中，二者环接构成「小周天」最常见的一圈路径。N1、N2 只画这一圈；B0 的十二正经与 B1 的奇经八脉才是周身背景，不可把任督一圈等同于全身经络。"

# —— 补：后三卷与内丹后三阶的概念边界 ——
- term: "坎离 / 水火既济"
  note: "丹经以坎（水、肾）离（火、心）喻药物与鼎炉的关系，「取坎填离」「心肾相交」皆指这组关系，不是解剖结构，也不是可测的生理量。N4 已上线，只作符号层的可拆解关系件。《悟真篇》以「三家相见、取坎填离」概括初关炼精化气，后世丹书亦以心肾相交说中关；本图按前义标「初关 · 取坎填离」。"
- term: "三花聚顶 / 五气朝元"
  note: "精、气、神三花聚于顶，五脏之气归于中，属内丹符号层的收束表述，历代配属与解释不一。明清丹书多把二者写作十月胎圆或还虚前后的景象，亦有以「乾坤交媾」概括中关者；位次有异说，但通行不单列为「上关」。N5 按「中关 · 收束」标注，不指实为某一家的固定阶位，只作概念关系呈现，不拟真演示任何境界，也不作功效宣称。"
- term: "五行生克 / 五脏"
  note: "木火土金水与肝心脾肺肾的配属，及相生相克、气机升降的关系模型，是卷 C 脏腑五行（C0–C3，已上线）的对象。属传统分类与推演体系，不作脏腑生理说明，更不作诊疗依据。"
- term: "十二消息卦 / 进阳火退阴符"
  note: "以十二卦配十二月、十二时辰描述火候消长的易象模型；进阳火、退阴符、沐浴温养皆其中术语。卷 D 火候易象（D0–D3）已上线。图中只用同一相位下的分段速度示意，不代表任何可测量的量。"
- term: "内经图 / 修真图"
  note: "明清丹道图谱，以山水、人物、器物隐喻体内路线与次第，版本与配属多有异同。卷 E 古图复原（E0–E2）已上线，只做 3D 拆解与图层对照，不作版本校勘结论，也不承诺与原图逐像素对应。"
- term: "气机升降"
  note: "脾升胃降为中焦之枢，肝升肺降调周身之气，心肾相交为水火既济。C2 以两条中轴线的往返示此动态；属关系模型，不是消化或循环生理的描述。"
- term: "文火 / 武火 / 沐浴"
  note: "火候的强度与暂停：文火缓、武火急、止火后沐浴温养。D3 用内外两环的疾徐与最终淡出表示；三者是同一过程中的状态变化，不是三套功法。"
- term: "子午 / 卯酉（四正）"
  note: "「子午为经，卯酉为纬」：子午纵轴主抽添，卯酉横环主沐浴。D1 把两者叠成丹道大周天的空间骨架；与经络体系的大周天、真法的周天定义均不等同。"
- term: "回光返照 / 反照图"
  note: "《性命圭旨》反照图取「回光」原义：把向外驰求的注意力沿中轴收回下丹田，再由内达外朗照。E2 以两条反向曲线示此；今多作俗语，此处不用俗语义。"
- term: "二十八宿 / 月相环（古图刻度）"
  note: "《修真图》一类古图以周天宿度、月相盈亏比附体内火候，属「以天时喻人事」的符号系统。E1 只作结构对照，不作天文、生理或功效断言。"

# —— 补：2026-11-09 体系校订 · 次第、性功与读序 ——
- term: "上关（丹道通行义）"
  note: "通行次第为筑基 → 初关百日（炼精化气）→ 中关十月（炼气化神）→ 上关（炼神还虚，又称九年关，含三年哺乳、九年面壁）→ 炼虚合道。「上关」专指炼神还虚，不指三花聚顶／五气朝元。本卷曾以「上关 · 归一」编排 N5，属名实错置，2026-11-09 起停用该名目，N5 改标「中关 · 收束（本卷终图）」。"
- term: "不设上关图的理由"
  note: "「炼神还虚」「炼虚合道」在清净丹法中含乳哺、出神、粉碎虚空等内容，且丹家明言此段属无为性功、全在心性上做文章，没有采药、火候、路径一类可拆解的结构。故本卷止于 N5 不只是内容边界（不拟真演示出神／阳神／长生、不作功效宣称），更是学理上的不可图像化；此为有意的范围限定，非次第遗漏。文献次第与图号的对应见 `/xiuxing/neidan/` 的「次第 ↔ 图号对照」表。"
- term: "活子时"
  note: "丹家以一阳来复之机为「活子时」，不依夜半子时等固定刻度，与「死子时」相对。火候进退取决于此机，而非钟表时刻。图中驱动用的相位只是建模变量，既不是活子时，也不是火候本身；本栏目不传授任何口诀。"
- term: "性功 / 命功（性命双修）"
  note: "命功指精气、身形、气脉一边，性功指心性、见地、觉照一边。宋元内丹讲性命双修，南北宗只在一先一后上分歧（南宗先命后性、全真北宗先性后命）。本栏目 21 图全在命功之「象」，未画性功之「行」；上关（炼神还虚）在丹家即属彻底的性功。"
- term: "炼己"
  note: "丹家以「炼己」为入手先务，指收摄心念、去习气、立见地，常说「未炼还丹先炼性，未修大药且修心」。它不是六图中的某一阶，而是贯穿始终的地基；正因属心性事，无法做成可拆解的结构图。见栏目页「图上没有的那一半」。"
- term: "功行 / 三千功行"
  note: "丹经于功法之外另说「功行」，指日用伦常中的德行与利物济人之事（如「修到三千功行满」）。《悟真篇》一系强调功行两全，缺此则功夫无落脚处。经典依据见《中华道藏》第 4 册《上清众真教戒德行经》《太极真人问功德行业经》与第 42 册「科戒威仪」。属栏目页「图上没有的那一半」，不在 21 图范围。"
- term: "三教合一"
  note: "宋元以后内丹大量吸收禅宗的明心见性与儒家的存心养性、慎独、日用伦常，讲三教同源。故「修行」在文献里从来不只是气脉路线；本栏目只取道医象数一线作结构可视化，儒释心性一线见栏目页「图上没有的那一半」。"
- term: "源流层位（栏目编排用语）"
  note: "栏目自造的编排用语，非传统术语。指把所依据的说法按时代与所答问题分层标明：先秦《老》《庄》与《内经》的气化身体、六朝上清存思、汉《参同契》的象数、唐钟吕三关与《坐忘论》、宋《悟真篇》与全真、明清《性命圭旨》《伍柳仙宗》及内经图、近代仙学与静坐法、真气运行法。列此层位是为避免把不同时代的身体观压成同一平面，详见栏目页「源流层位」；各层另标藏内／藏外。"

# —— 补：栏目自造的建模用语，避免被误读为传统术语 ——
- term: "相位 / 单一输入（建模用语）"
  note: "本栏目自造的建模用语，非传统术语。每张图只设一个输入变量（呼吸相位、周天度数、流注相位……），气团位置、经络高亮、面板读数与自动导览都由它推导，以保证读数与画面同源；「相位」只表示该变量在一圈中的进度，不对应任何生理周期。"
- term: "读序 / 文献整理顺序（编排用语）"
  note: "栏目自造的编排用语，非传统术语。图号 N0–N5、C0–C3、D0–D3 与卡片上的 level 只表示文献整理与拆解的先后，不是实修阶次，更不是功法课程序列；同一卷内可按读序前后对照；参照系（A 卷 N0、N1、N3）不占阶位，也不参与初关次第。2026-11-09 起全栏目统一以「读序」代替「次第递进／阶」。"

# —— 补：2026-11-09 典籍源评估 · 断代、版本与外丹分野 ——
- term: "六朝上清存思 / 身内神真"
  note: "《中华道藏》第 1–2 册「洞真上清经」所收《大洞真经》《真诰》《登真隐诀》《上清握中诀》《上清洞真九宫紫房图》一系，以身内神真、九宫、三部八景为图，所答是「身中有哪些神真、如何存思」。它比钟吕内丹周天更早，也不是气沿任督的模型，属另一套身体图像传统。本栏目未画；E 卷「把隐语逐件标回人体」在方法上更接近这一系，而不是内丹周天图。"
- term: "中华道藏（断代与七部类）"
  note: "2004 年华夏出版社出版，中国道教协会编、张继禹主编，49 册、收书 1526 种、5500 余卷。以明《正统道藏》《万历续道藏》为底本，补入敦煌写本、简帛与旧抄佚经；保留三洞四辅名目而按内容重分七部类：三洞真经 1–6、四辅真经 7–23、道教论集 24–29、道法众术 30–41、道教科仪 42–44、道史仙传 45–48、目录索引 49。断代大体止于明代以前，故《性命圭旨》《伍柳仙宗》、内经图／修真图与近代真气运行法均属藏外，本站明清与近代两层需另找藏外文献。"
- term: "外丹 / 内丹"
  note: "外丹指以炉鼎烧炼矿物、服食丹药，《中华道藏》第 18–19 册「太清金丹经」即明标「外丹服食」，收《黄帝九鼎神丹经诀》《抱朴子神仙金汋经》《石药尔雅》《丹方鉴源》《铅汞甲庚至宝集成》《神仙服饵丹石行药法》等，涉汞、铅、丹砂等有毒矿物；内丹则以身为鼎炉、以精气神为药物，是后世另一套实践与语言。二者不可混为一谈。本栏目 21 图全属内丹符号层，不收录外丹方诀、不作配方式呈现，亦不提供任何服食或烧炼信息；此类方诀切勿尝试。"
- term: "涵芬楼本《正统道藏》（版本锚点）"
  note: "1923 年上海涵芬楼以北京白云观所藏明《正统道藏》缩印成 36 开线装本，此后近百年多数影印本祖此。识典古籍「道教部」公开文本统一标注「上海涵芬楼影印明《正统道藏》本」为底本，可作查文之便；其白话译文属现代诠释，不等于原文，也不作版本校勘结论（与 E 卷「不作版本校勘结论」同口径）。本栏目只引书目与册次，不搬录两站全文。"

# —— 补：2026-11-09 第四轮 · 参照系、性别与导引图像 ——
- term: "参照系（编排用语）"
  note: "栏目自造的编排用语，非传统术语。A 卷内 N0（近代静坐三调）、N1（现代养生功法）、N3（医家经络）与丹道次第不同系，只作结构参照，不占初关或中关阶位；初关只取 N2、N4。卡片 level 以「参照 · …」标出，次第对照表单列一行。"
- term: "女丹"
  note: "女丹为独立一系，讲斩赤龙、太阴炼形等次第，与男性通行丹法不可以同一三田、同一火候套用。本栏目 21 图共用一具 170 cm 男性底模，未及女丹；女性实修应寻女丹一系或有女性教学经验的老师，不可径用本栏目图示。"
- term: "导引图谱"
  note: "汉唐另有一支以姿态示功法的图像传统：马王堆三号汉墓《导引图》44 式（西汉）、张家山汉简《引书》、陶弘景《导引养生图》（佚，书目著录）、旧题陈抟《二十四气坐功导引治病图》、明周履靖《赤凤髓》五禽图等。E 卷只收《内经图》《修真图》《性命圭旨》反照图三张明清丹道隐喻图，不代表古代功法图谱全貌。"
