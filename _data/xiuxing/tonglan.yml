# 卷 G · 通览与异说。不新增体系，只把既有各卷叠合或并列对照。
intro: "前五卷各问一件事，本卷问两件收束的事：把它们叠在同一具人体上会看见什么，以及同名异实的说法究竟差在哪里。合图不为主张同源，只为对照结构；异说不为调和，只为把分歧摆到同一张图上。"

