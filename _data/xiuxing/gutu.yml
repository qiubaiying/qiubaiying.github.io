# 古图复原专题。把三张经典丹道图谱里的隐喻，逐件对照回同一具人体。
intro: "古人把内丹画成山水、星宿与回光，用隐语把路径藏进图里。这个专题做一件笨功夫：把《内经图》《修真图》《性命圭旨》反照图里的隐喻逐件标回人体，看它们与前面那些 3D 图谱是不是同一套结构。原图是平面隐喻，这里是可转、可拆的对照模型，不是古画复原。"

