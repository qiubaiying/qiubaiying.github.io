# 行序与行持卡：单一数据源。
# schools 是三套不可混用的坐标（浮层「我的一门」）；days 是七日入手路径（总览读取）；
# cards 是各图的行持卡（3D 页浮层读取）。
# 每张卡只需写 note（这张图在坐垫上对应什么、不对应什么），其余六格继承 defaults，个别可覆盖。
# 改本文件后须重新生成 js/xiuxing-practice-data.js（见 CONTENT-PLAN.md），
# scripts/xiuxing-verify.py 会比对两者是否一致。

intro: "读序管文献整理，行序管今天做什么。七日入手不新增体系，只把已有各卷重新排成一条可走的路；每晚一笔四验，比多看三张图要紧。"

defaults:
  sit: "端坐，脊背自然正直，肩松、手轻放膝上；坐不稳可垫高臀部"
  breath: "呼吸任其自然，由粗渐细，不用力、不憋气、不数息催赶"
  note: "此图只作结构参照"
  time: "一坐 10–15 分钟；或只看完一圈相位即可"
  close: "收功：两手叠于腹前，静坐数息，睁眼、活动手足再起身"
  check: "睡眠、食欲、情绪、人际四项，有无比昨日差"

schools:
  - key: zhenfa
    name: "真气运行法"
    brief: "20 世纪中期成型的现代气功体系，公开、次第清楚"
    fields: "上丹田百会 · 中丹田心窝部 · 下丹田小腹部"
    orbit: "任督一圈（经络周天）；不占丹道初关阶位"
    passes: "尾闾、夹脊、玉枕"
    source: "李少波真气运行法公开所述"
  - key: dandao
    name: "丹道通行"
    brief: "宋元内丹至明清丹书的通行次第"
    fields: "泥丸（上） · 绛宫（中） · 气海（下）"
    orbit: "小周天子午周天；大周天卯酉周天"
    passes: "尾闾、夹脊、玉枕（具体位置历代有异说）"
    source: "《悟真篇》一系与明清丹书通行说法"
  - key: yijia
    name: "医家经络"
    brief: "《内经》《灵枢》的气血身体观，不谈丹法次第"
    fields: "不以三田立坐标，以十二正经与奇经八脉为网"
    orbit: "十二经如环无端流注；营在脉中、卫在脉外"
    passes: "三关非医家概念"
    source: "《灵枢·经脉》《灵枢·营卫生会》"

days:
  - d: 1
    name: "定坐标"
    do: "读《第六问 · 行》，择一门，一年内不换"
    url: "/xiuxing/xing/"
    atlas: "第六问 · 行"
    check: "能说出自己这一门的三田与周天各指什么"
  - d: 2
    name: "入一息"
    do: "按 H0 静坐一课坐一坐：正体、调息、凝神、任运、收功"
    url: "/xiuxing/jingzuo.html"
    atlas: "H0 静坐一课"
    check: "一坐之后，睡眠与情绪没有变差"
  - d: 3
    name: "认身体"
    do: "看 B0 十二正经与 C0 五脏，只认结构，不找感觉"
    url: "/xiuxing/shierjing.html"
    atlas: "B0 十二正经"
    check: "能说出任督一圈不等于全身经络"
  - d: 4
    name: "辨刻度"
    do: "D0 十二消息卦与 B2 子午流注对照，认出两套时间模型"
    url: "/xiuxing/xiaoxi.html"
    atlas: "D0 十二消息卦"
    check: "能说出卦气刻度不是钟表时刻"
  - d: 5
    name: "看隐喻"
    do: "E2 反照图，只取「把注意力收回」这一层"
    url: "/xiuxing/fanzhao.html"
    atlas: "E2 反照图"
    check: "走神时能自己收回，不追境界"
  - d: 6
    name: "查异说"
    do: "G1 三田三关对照，确认自己没混用两套坐标"
    url: "/xiuxing/santian.html"
    atlas: "G1 三田三关"
    check: "能说出真法三田与丹道三田定位的差别"
  - d: 7
    name: "回头验"
    do: "按 H0 再坐一坐，填四验，再决定下一周读哪卷"
    url: "/xiuxing/jingzuo.html"
    atlas: "H0 静坐一课"
    check: "四项生活指标不退，才继续往下走"

cards:
  - id: N0
    slug: santiao
    note: "调身→调息→调心依次放宽；一坐里只做这三件事，不追气感，也不搬运。"
    sit: "坐垫前半，膝低于胯，先从头顶到足底依次松开，再落到呼吸"
    time: "第一周每日一坐 10 分钟，宁短勿断"
  - id: N1
    slug: zhenqi
    note: "真法三田（百会／心窝／小腹）与丹道三田不是同一套坐标；看这一圈前先确认自己用哪一门。"
  - id: N2
    slug: heche
    note: "采封炼止是丹经对初关的分段说法；坐中只观分段，不照三关缓中疾去催。"
  - id: N3
    slug: dazhoutian
    note: "医家十二经流注不是丹道周天；此图作经络背景看，不作任督搬运的指令。"
  - id: N4
    slug: kanli
    note: "心肾相交是关系模型；只留意水火既济的意象，不刻意引气上行下行。"
  - id: N5
    slug: sanhua
    note: "三花聚顶、五气朝元属符号层收束；不设体验清单，也不作境界核对。"
  - id: B0
    slug: shierjing
    note: "十二正经是循行主干；看当令一经的高亮即可，不必按经找感觉。"
  - id: B1
    slug: qijingbamai
    note: "奇经八脉是蓄溢调节；任督只是其中二脉，别把一圈当成整张网。"
  - id: B2
    slug: ziwuliuzhu
    note: "子午流注是时间模型；不必按时辰挑练功时刻。"
  - id: B3
    slug: yingwei
    note: "营在脉中、卫在脉外是两层；只作内外背景，不追求体表的气感。"
  - id: C0
    slug: wuzang
    note: "五脏位置为教学示意，不是解剖图；不作取穴或脏腑保健依据。"
  - id: C1
    slug: shengke
    note: "生克制化是关系推演；坐中不套用五行去「补」某一脏。"
  - id: C2
    slug: qiji
    note: "脾升胃降、肝升肺降说的是气机关系，不是呼吸或消化的动作要领。"
  - id: C3
    slug: wuqichaoyuan
    note: "五气朝元在脏腑卷只讲关系归中，不涉内丹境界。"
  - id: D0
    slug: xiaoxi
    note: "十二消息卦是卦气刻度；进火退符不依钟表，坐中不必数卦。"
  - id: D1
    slug: ziwu
    note: "子午为经、卯酉为纬是丹道大周天的空间骨架，与经络周天不同义，别混着走。"
  - id: D2
    slug: sanchehuo
    note: "三车缓中疾是火候的比喻；图中速度差只是分段示意，不照它调速。"
  - id: D3
    slug: muyu
    note: "文火武火、沐浴温养是同一过程的状态变化；止火后归养，不另起一功。"
    close: "收功即「止火」：停掉一切用意，两手叠于腹前静坐数息再起身"
  - id: E0
    slug: neijingtu
    note: "十二重楼、铁牛耕地是隐喻；逐件认回人体即可，不照山水路线行气。"
  - id: E1
    slug: xiuzhentu
    note: "二十八宿、月相环是以天时喻人事；不作天文或生理断言。"
  - id: E2
    slug: fanzhao
    note: "回光返照是把向外驰求的注意力收回；只取收心一层，不作目光或意守的硬性规定。"
    breath: "只管呼吸自然，注意力收回时不要跟着屏息"
  - id: F0
    slug: xuewei
    note: "三十处点位为教学示意，不承诺定位精度，不作取穴依据。"
  - id: F1
    slug: jingjin
    note: "经筋是结、聚、散、络的层次，不是解剖筋膜；看层次即可。"
  - id: F2
    slug: pibu
    note: "十二皮部是体表分区示意，与卫气行于脉外互为背景。"
  - id: F3
    slug: luomai
    note: "络脉与经别是把表里两经连成网的分支；看分支关系，不当新路线。"
  - id: G0
    slug: hecan
    note: "五组几何叠在同一具底模只为对照结构；底模相同不等于体系相同。"
  - id: G1
    slug: santian
    note: "两套三田、三关异说并列；在浮层「我的一门」里定好坐标，再回查其余各图。"
  - id: H0
    slug: jingzuo
    note: "一坐五段是先后，不是成绩；坐时依次放宽，走到「任运」就别再调整姿势与呼吸。"
    time: "一坐 10–15 分钟；第一周宁短勿断"
  - id: H1
    slug: daoyin
    note: "八式是姿态的读序；看图认哪一段牵动哪组经脉，动作分解另找教学，不照示意图硬做。"
    sit: "站立或端坐均可，先看一遍八式再动；脊柱保持自然直立"
  - id: H2
    slug: liuzijue
    note: "六字配脏腑是分类关系；只认配属，音声方法属口传，不在图示范围。"
  - id: H3
    slug: zuowang
    note: "七阶是《坐忘论》的收心次第；走神即带回即可，别把它当成可勾选的进度表。"
