# 四图共用同一具底模、同一套面板与同一个相位输入；次第是文献读序，不是修证阶次。
intro: "前七卷问「象」：路径、网络、关系、刻度、图式、层次与异说。本卷问坐垫上的那一件事——从坐下到起身怎么分段。四张图把传统入手科目的文献次第拆成可看的段：一坐的时序、导引的八式、六字的配属、坐忘的七阶。曲线与底模沿用 B0，姿态只作位置示意，不替代动作分解；每张图仍只由一个相位输入驱动。"

