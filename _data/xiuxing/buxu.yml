# 卷 F · 经络补遗。四张图补 B 卷未画的经络层次，共用同一具人体底模与同一份曲线库。
# source 为典籍依据；曲线由十二正经示意派生者已在 desc 与 disclaimer 中注明。
intro: "B 卷把经络拆成主干、调控、时间与内外四个并列维度，本卷补它没有画的另外几层：穴位是点，经筋与皮部是层次，络脉与经别是分支。四张图共用同一具底模与同一份曲线库，属并列维度、无先后；新增曲线均由十二正经示意派生，不作独立定位数据。"

