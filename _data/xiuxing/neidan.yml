# 内丹专题图谱清单。status: 已上线 / 规划中。
# driver 是每张图唯一的输入变量，姿态、高亮、读数与导览都由它推导。
intro: "内丹把人体当鼎炉，把精、气、神当药物，把时机与强度当火候。这个专题按「筑基 → 炼精化气 → 炼气化神 → 炼神还虚」的次第，把传统文本里只能靠想象串起来的路线做成能转、能拆、能看数的图。每张图只由一个输入驱动。"

