# 内丹专题图谱清单。status: 已上线 / 规划中。
# driver 是每张图唯一的输入变量，姿态、高亮、读数与导览都由它推导。
# level 是文献整理标签（所据体系与段落），不是实修阶次；图号 N0–N5 是读序，不是功法课程序列。
intro: "内丹把人体当鼎炉，把精、气、神当药物，把时机与强度当火候。本专题按「入手 → 初关（小周天／炼精化气）→ 中关（炼气化神）」的文献次第整理六张图：N2、N4 属初关，N5 以三花聚顶／五气朝元收束于中关；N0 是近代静坐三调，N1 是现代养生功法，N3 是医家经络，三者作参照系，不占丹道阶位。中关的过程（大周天／十月养胎）以 D1 卯酉周天为空间骨架，本卷不另设过程图；筑基炼己（炼己、补亏、开关展窍）属心性与补亏工夫，本卷不设图。图号是文献整理顺序，不是功法课程序列，也不代表实修先后；上关（炼神还虚）与炼虚合道属无为性功，全在心性上做文章，没有可拆解的路径、药物与火候可画，故不设图，亦不作境界或效验演示。每张图只由一个输入驱动；本栏目是概念模型的可视化，不提供任何练法，实修须师承。"

