    level: "主干 · 十二正经"
    status: "已上线"
    source: "《灵枢·经脉》十二正经循行"
    driver: "流注相位"
    url: "/xiuxing/shierjing.html"
    cover: "/xiuxing/cover-shierjing.png"
    desc: "按四类走向逐组拆解：手三阴从胸走手、手三阳从手走头、足三阳从头走足、足三阴从足走腹，最后合为肺→大肠→胃→…→肝的如环无端。朱砂高亮的是此刻当令的一经。"
