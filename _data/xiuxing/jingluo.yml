# 经络气血专题图谱清单。四张图共用同一份曲线库（十二正经 / 奇经八脉 / 时辰环 / 卫气环）。
intro: "内丹专题讲「气怎么走」，经络专题讲「走在哪张网里」。先用四张图把这张网拆开：十二正经是主干，奇经八脉是水库与约束，子午流注给它加上时间刻度，营卫与大周天区分脉中、脉外两层循环。四张图共用同一份曲线库与人体底模，切换时界面不变。"

items:
