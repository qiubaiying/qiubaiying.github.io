# 脏腑五行专题。四张图共用同一组可拆解五脏与五行环。
intro: "内丹讲气怎么走，经络讲走在哪张网里，脏腑五行则讲这张网挂在哪套关系上。肝木、心火、脾土、肺金、肾水不是五种物质，而是一组生克制化、升降出入的关系模型。四张图把五脏做成可拆解的部件，让关系能被转着看。"

